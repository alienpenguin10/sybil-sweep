<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sybil Sweep</title>
  <style>
    :root {
      --bg0: #0b1220;
      --bg1: #121a2b;
      --ink: #e8eefc;
      --muted: #8b9bb8;
      --blue: #3b82f6;
      --red: #ef4444;
      --amber: #f59e0b;
      --line: rgba(255,255,255,0.08);
      --accent: #22d3ee;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(34,211,238,0.12), transparent 55%),
        radial-gradient(900px 500px at 90% 0%, rgba(239,68,68,0.10), transparent 50%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      color: var(--ink);
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
    }
    header {
      display: flex; align-items: baseline; gap: 1rem;
      padding: 1rem 1.25rem 0.5rem;
      border-bottom: 1px solid var(--line);
    }
    header h1 {
      margin: 0; font-size: 1.55rem; letter-spacing: -0.02em;
      font-family: "IBM Plex Mono", "SF Mono", Menlo, monospace;
    }
    header h1 span { color: var(--accent); }
    header p { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      height: calc(100% - 64px);
    }
    #stage { position: relative; min-width: 0; }
    canvas { width: 100%; height: 100%; display: block; }
    aside {
      border-left: 1px solid var(--line);
      padding: 0.85rem;
      overflow: auto;
      background: rgba(0,0,0,0.18);
    }
    .metrics {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;
      margin-bottom: 0.9rem;
    }
    .metric {
      padding: 0.65rem 0.7rem;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
    }
    .metric b { display: block; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
    .metric span { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .legend { display: flex; gap: 0.85rem; margin: 0 0 0.85rem; font-size: 0.8rem; color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 0.35rem; }
    .dot.red { background: var(--red); box-shadow: 0 0 10px rgba(239,68,68,0.55); }
    .dot.blue { background: var(--blue); }
    .dot.amber { background: var(--amber); }
    h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0.4rem 0 0.55rem; }
    .card {
      border: 1px solid var(--line);
      padding: 0.7rem 0.75rem;
      margin-bottom: 0.55rem;
      background: linear-gradient(135deg, rgba(239,68,68,0.08), transparent 60%);
    }
    .card strong { display: block; margin-bottom: 0.25rem; }
    .card .row { color: var(--muted); font-size: 0.78rem; line-height: 1.45; word-break: break-all; }
    .conf { color: var(--red); font-weight: 600; }
    footer {
      position: absolute; left: 1rem; bottom: 0.75rem;
      color: var(--muted); font-size: 0.75rem;
      pointer-events: none;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; }
      aside { border-left: 0; border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header>
    <h1>Sybil <span>Sweep</span></h1>
    <p>Detect → show → <strong style="color:var(--ink)">enforce</strong> on Monad</p>
  </header>
  <div class="layout">
    <div id="stage">
      <canvas id="g"></canvas>
      <footer id="foot">Loading graph_data.js…</footer>
    </div>
    <aside>
      <div class="metrics" id="metrics"></div>
      <div class="legend">
        <span><i class="dot red"></i>farm</span>
        <span><i class="dot blue"></i>human</span>
        <span><i class="dot amber"></i>suspect</span>
      </div>
      <h2>Attested clusters</h2>
      <div id="cards"></div>
    </aside>
  </div>
  <script src="graph_data.js"></script>
  <div id="boot"></div>
  <script>
    (function () {
      const data = window.SYBIL_GRAPH;
      const foot = document.getElementById("foot");
      const metricsEl = document.getElementById("metrics");
      const cardsEl = document.getElementById("cards");
      if (!data) {
        foot.textContent = "Missing graph_data.js — run: python3 sybil_detector.py";
        return;
      }

      const m = data.metrics || {};
      metricsEl.innerHTML = [
        ["Claimants", m.claimants ?? "—"],
        ["Flagged", m.flagged ?? "—"],
        ["Precision", m.precision != null ? (m.precision * 100).toFixed(1) + "%" : "—"],
        ["Recall", m.recall != null ? (m.recall * 100).toFixed(1) + "%" : "—"],
      ].map(([k, v]) => `<div class="metric"><span>${k}</span><b>${v}</b></div>`).join("");

      (data.clusters || []).forEach((c) => {
        const conf = (c.confidenceBps / 100).toFixed(1);
        const funder = (c.funder || "").slice(0, 10) + "…" + (c.funder || "").slice(-4);
        cardsEl.innerHTML += `
          <div class="card">
            <strong>Cluster #${c.onchainClusterId} · <span class="conf">${conf}%</span></strong>
            <div class="row">${c.size} wallets · window ${c.fundingWindowSecs}s</div>
            <div class="row">funder ${funder}</div>
          </div>`;
      });
      if (!(data.clusters || []).length) {
        cardsEl.innerHTML = `<div class="row" style="color:var(--muted)">No clusters above risk floor.</div>`;
      }

      foot.textContent = `${(data.nodes || []).length} nodes · ${(data.links || []).length} edges · offline demo`;

      // --- Force graph (no deps) ---
      const canvas = document.getElementById("g");
      const ctx = canvas.getContext("2d");
      const stage = document.getElementById("stage");

      const nodes = (data.nodes || []).map((n, i) => ({
        ...n,
        x: Math.cos(i) * 180 + 400,
        y: Math.sin(i * 1.7) * 140 + 300,
        vx: 0,
        vy: 0,
      }));
      const byId = Object.fromEntries(nodes.map((n) => [n.id, n]));
      const links = (data.links || [])
        .map((l) => ({ ...l, s: byId[l.source], t: byId[l.target] }))
        .filter((l) => l.s && l.t);

      // Pull same-cluster nodes together
      function tick() {
        const n = nodes.length;
        for (let i = 0; i < n; i++) {
          for (let j = i + 1; j < n; j++) {
            const a = nodes[i], b = nodes[j];
            let dx = a.x - b.x, dy = a.y - b.y;
            let dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
            let force = 400 / (dist * dist);
            if (a.cluster >= 0 && a.cluster === b.cluster) force *= 0.15;
            let fx = (dx / dist) * force;
            let fy = (dy / dist) * force;
            a.vx += fx; a.vy += fy;
            b.vx -= fx; b.vy -= fy;
          }
        }
        for (const l of links) {
          let dx = l.t.x - l.s.x, dy = l.t.y - l.s.y;
          let dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
          const target = l.kind === "funding" ? 70 : 36;
          let f = (dist - target) * 0.01;
          let fx = (dx / dist) * f, fy = (dy / dist) * f;
          l.s.vx += fx; l.s.vy += fy;
          l.t.vx -= fx; l.t.vy -= fy;
        }
        const cx = canvas.width / (2 * (window.devicePixelRatio || 1));
        const cy = canvas.height / (2 * (window.devicePixelRatio || 1));
        for (const n of nodes) {
          n.vx += (cx - n.x) * 0.002;
          n.vy += (cy - n.y) * 0.002;
          n.vx *= 0.85; n.vy *= 0.85;
          n.x += n.vx; n.y += n.vy;
        }
      }

      function color(n) {
        if (n.suspect) return "#f59e0b";
        if (n.cluster >= 0) return "#ef4444";
        if (n.isFunder) return "#64748b";
        return "#3b82f6";
      }

      function draw() {
        const dpr = window.devicePixelRatio || 1;
        const w = stage.clientWidth, h = stage.clientHeight;
        canvas.width = w * dpr; canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);

        for (let i = 0; i < 2; i++) tick();

        ctx.lineWidth = 1;
        for (const l of links) {
          const farm = l.s.cluster >= 0 && l.t.cluster >= 0;
          ctx.strokeStyle = farm ? "rgba(239,68,68,0.35)" : "rgba(59,130,246,0.12)";
          ctx.beginPath();
          ctx.moveTo(l.s.x, l.s.y);
          ctx.lineTo(l.t.x, l.t.y);
          ctx.stroke();
        }
        for (const n of nodes) {
          const r = n.isFunder ? 3.5 : n.cluster >= 0 ? 5.5 : 4;
          ctx.beginPath();
          ctx.fillStyle = color(n);
          ctx.globalAlpha = n.isFunder ? 0.55 : 0.95;
          ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
        requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>
</body>
</html>
