name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "detector/**"
      - "data/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate graph data
        run: python3 detector/detector.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install & build
        working-directory: dashboard
        env:
          GITHUB_PAGES: "true"
          VITE_CHAIN_ID: "10143"
          VITE_MONAD_RPC: "https://testnet-rpc.monad.xyz"
          VITE_EXPLORER_URL: "https://testnet.monadvision.com"
          VITE_SYBIL_REGISTRY: ${{ vars.VITE_SYBIL_REGISTRY }}
          VITE_SYBIL_AIRDROP: ${{ vars.VITE_SYBIL_AIRDROP }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
